version: 0.0
os: linux

# Copies the release bundle onto the instance. The directories below are
# created by the CI job before the bundle is zipped and uploaded to S3.
files:
  - source: backend
    destination: /opt/app/backend
  - source: frontend
    destination: /opt/app/frontend

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 900
      runas: root
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 300
      runas: root
