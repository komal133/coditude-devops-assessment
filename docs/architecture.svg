<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0b3d66">AWS Architecture — Next.js + Python + PostgreSQL</text>
  <text x="590" y="55" text-anchor="middle" font-size="12" fill="#5a6b78">Containerised (ECS Fargate) and non-containerised (EC2 + CodeDeploy) deployments, two Availability Zones</text>

  <!-- Region -->
  <rect x="30" y="72" width="1120" height="600" rx="8" fill="#f7fafc" stroke="#9aa8b5" stroke-dasharray="6 4"/>
  <text x="44" y="92" font-size="12" font-weight="bold" fill="#5a6b78">AWS Region — ap-south-1</text>

  <!-- VPC -->
  <rect x="46" y="104" width="770" height="552" rx="6" fill="#ffffff" stroke="#0b3d66" stroke-width="1.5"/>
  <text x="60" y="124" font-size="12" font-weight="bold" fill="#0b3d66">VPC 10.20.0.0/16 — Availability Zone A + Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="60" y="136" width="742" height="112" rx="5" fill="#eaf4ea" stroke="#4c8b4c"/>
  <text x="72" y="154" font-size="11" font-weight="bold" fill="#2f6b2f">Public subnets  10.20.1.0/24 · 10.20.2.0/24</text>
  <rect x="86" y="164" width="200" height="64" rx="4" fill="#ffffff" stroke="#4c8b4c"/>
  <text x="186" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ALB · dev-ecs-alb</text>
  <text x="186" y="206" text-anchor="middle" font-size="10" fill="#5a6b78">HTTP 80 / HTTPS 443</text>
  <text x="186" y="220" text-anchor="middle" font-size="10" fill="#5a6b78">/api/* → backend TG</text>
  <rect x="310" y="164" width="200" height="64" rx="4" fill="#ffffff" stroke="#4c8b4c"/>
  <text x="410" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ALB · dev-ec2-alb</text>
  <text x="410" y="206" text-anchor="middle" font-size="10" fill="#5a6b78">HTTP 80</text>
  <text x="410" y="220" text-anchor="middle" font-size="10" fill="#5a6b78">/api/* → backend TG</text>
  <rect x="596" y="164" width="180" height="64" rx="4" fill="#ffffff" stroke="#4c8b4c"/>
  <text x="686" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">NAT Gateway</text>
  <text x="686" y="210" text-anchor="middle" font-size="10" fill="#5a6b78">egress only</text>

  <!-- App subnets -->
  <rect x="60" y="264" width="742" height="180" rx="5" fill="#eef2fa" stroke="#4a63a8"/>
  <text x="72" y="282" font-size="11" font-weight="bold" fill="#33487f">Private application subnets  10.20.11.0/24 · 10.20.12.0/24</text>

  <rect x="86" y="294" width="330" height="134" rx="4" fill="#ffffff" stroke="#4a63a8"/>
  <text x="251" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#33487f">ECS Fargate — containerised</text>
  <rect x="102" y="326" width="140" height="44" rx="3" fill="#f3f6fd" stroke="#8fa2cf"/>
  <text x="172" y="345" text-anchor="middle" font-size="11" fill="#1a1a1a">Next.js task</text>
  <text x="172" y="360" text-anchor="middle" font-size="10" fill="#5a6b78">port 3000</text>
  <rect x="260" y="326" width="140" height="44" rx="3" fill="#f3f6fd" stroke="#8fa2cf"/>
  <text x="330" y="345" text-anchor="middle" font-size="11" fill="#1a1a1a">FastAPI task</text>
  <text x="330" y="360" text-anchor="middle" font-size="10" fill="#5a6b78">port 8000</text>
  <text x="251" y="392" text-anchor="middle" font-size="10" fill="#5a6b78">auto scaling on CPU · circuit breaker rollback</text>
  <text x="251" y="410" text-anchor="middle" font-size="10" fill="#5a6b78">secrets injected by the ECS agent</text>

  <rect x="440" y="294" width="336" height="134" rx="4" fill="#ffffff" stroke="#4a63a8"/>
  <text x="608" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#33487f">EC2 Auto Scaling Group — non-containerised</text>
  <rect x="456" y="326" width="144" height="44" rx="3" fill="#f3f6fd" stroke="#8fa2cf"/>
  <text x="528" y="345" text-anchor="middle" font-size="11" fill="#1a1a1a">frontend.service</text>
  <text x="528" y="360" text-anchor="middle" font-size="10" fill="#5a6b78">port 3000</text>
  <rect x="616" y="326" width="144" height="44" rx="3" fill="#f3f6fd" stroke="#8fa2cf"/>
  <text x="688" y="345" text-anchor="middle" font-size="11" fill="#1a1a1a">backend.service</text>
  <text x="688" y="360" text-anchor="middle" font-size="10" fill="#5a6b78">port 8000</text>
  <text x="608" y="392" text-anchor="middle" font-size="10" fill="#5a6b78">Amazon Linux 2023 · systemd · CodeDeploy agent</text>
  <text x="608" y="410" text-anchor="middle" font-size="10" fill="#5a6b78">secret fetched with the instance IAM role</text>

  <!-- DB subnets -->
  <rect x="60" y="460" width="742" height="106" rx="5" fill="#fdf1ea" stroke="#c0703a"/>
  <text x="72" y="478" font-size="11" font-weight="bold" fill="#a1552a">Private database subnets  10.20.21.0/24 · 10.20.22.0/24  — no route to the internet</text>
  <rect x="280" y="490" width="300" height="62" rx="4" fill="#ffffff" stroke="#c0703a"/>
  <text x="430" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Amazon RDS for PostgreSQL</text>
  <text x="430" y="532" text-anchor="middle" font-size="10" fill="#5a6b78">encrypted · automated backups · Multi-AZ in prod</text>

  <text x="72" y="600" font-size="10" fill="#5a6b78">Security groups: ALB accepts 80/443 from the internet · apps accept 3000/8000 only from the ALB · RDS accepts 5432 only from the app tiers</text>
  <text x="72" y="620" font-size="10" fill="#5a6b78">No workload has a public IP address. Operator access is via AWS Systems Manager Session Manager, not SSH.</text>
  <text x="72" y="640" font-size="10" fill="#5a6b78">Environments: dev 10.20.0.0/16 · staging 10.30.0.0/16 · prod 10.40.0.0/16 — same templates, different parameter file.</text>

  <!-- Right column: regional services -->
  <rect x="830" y="136" width="306" height="64" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">Amazon ECR</text>
  <text x="983" y="181" text-anchor="middle" font-size="10" fill="#5a6b78">container images, scan on push</text>

  <rect x="830" y="212" width="306" height="64" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">AWS Secrets Manager</text>
  <text x="983" y="257" text-anchor="middle" font-size="10" fill="#5a6b78">DB password generated by AWS</text>

  <rect x="830" y="288" width="306" height="64" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">Amazon S3 (versioned)</text>
  <text x="983" y="333" text-anchor="middle" font-size="10" fill="#5a6b78">CodeDeploy release bundles</text>

  <rect x="830" y="364" width="306" height="64" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">AWS CodeDeploy</text>
  <text x="983" y="409" text-anchor="middle" font-size="10" fill="#5a6b78">rolling release + auto rollback</text>

  <rect x="830" y="440" width="306" height="80" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">Amazon CloudWatch + SNS</text>
  <text x="983" y="485" text-anchor="middle" font-size="10" fill="#5a6b78">logs · 5 alarms · dashboard</text>
  <text x="983" y="502" text-anchor="middle" font-size="10" fill="#5a6b78">email alerts</text>

  <rect x="830" y="532" width="306" height="80" rx="4" fill="#ffffff" stroke="#7a8b99"/>
  <text x="983" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">CodePipeline + CodeBuild</text>
  <text x="983" y="577" text-anchor="middle" font-size="10" fill="#5a6b78">AWS-native application pipeline</text>
  <text x="983" y="594" text-anchor="middle" font-size="10" fill="#5a6b78">source → build → ECS deploy</text>

  <!-- Users + GitHub -->
  <rect x="86" y="688" width="220" height="48" rx="24" fill="#0b3d66"/>
  <text x="196" y="718" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Users (browser)</text>
  <rect x="830" y="688" width="306" height="48" rx="6" fill="#24292f"/>
  <text x="983" y="710" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">GitHub Actions</text>
  <text x="983" y="727" text-anchor="middle" font-size="10" fill="#c9d1d9">OIDC — no stored AWS keys</text>

  <!-- Connectors -->
  <g stroke="#0b3d66" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M186 688 L186 232"/>
    <path d="M240 688 L410 688 L410 232"/>
    <path d="M186 232 L186 292"/>
    <path d="M410 232 L560 232 L560 292"/>
    <path d="M251 428 L251 452 L400 452 L400 490"/>
    <path d="M608 428 L608 452 L460 452 L460 490"/>
  </g>
  <g stroke="#7a8b99" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrowgrey)">
    <path d="M930 688 L930 620"/>
    <path d="M1060 688 L1060 352 L1136 352"/>
    <path d="M830 168 L420 168"/>
    <path d="M830 244 L700 244 L700 292"/>
    <path d="M830 396 L790 396 L790 360 L776 360"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0b3d66"/>
    </marker>
    <marker id="arrowgrey" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#7a8b99"/>
    </marker>
  </defs>
</svg>
