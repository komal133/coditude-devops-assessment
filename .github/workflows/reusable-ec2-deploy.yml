name: Reusable EC2 deploy

# Reusable workflow: one definition, called once per environment.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: CodeDeploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build bundle, upload to S3 and deploy
        run: |
          chmod +x deploy/build-ec2-bundle.sh
          IMAGE_TAG=${GITHUB_SHA::8} ./deploy/build-ec2-bundle.sh ${{ inputs.environment }}
