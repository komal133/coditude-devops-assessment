name: Backend application

# Triggered only by backend source changes. No CloudFormation command appears
# anywhere in this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'deploy/ecs-release.sh'
      - '.github/workflows/app-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r apps/backend/requirements.txt
      - name: Run pytest
        run: cd apps/backend && python -m pytest -q

  dev:
    name: Release to dev
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, push and roll out
        run: |
          chmod +x deploy/ecs-release.sh
          IMAGE_TAG=${GITHUB_SHA::8} ./deploy/ecs-release.sh dev backend apps/backend

  staging:
    name: Release to staging
    needs: dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, push and roll out
        run: |
          chmod +x deploy/ecs-release.sh
          IMAGE_TAG=${GITHUB_SHA::8} ./deploy/ecs-release.sh staging backend apps/backend

  prod:
    name: Release to prod
    needs: staging
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, push and roll out
        run: |
          chmod +x deploy/ecs-release.sh
          IMAGE_TAG=${GITHUB_SHA::8} ./deploy/ecs-release.sh prod backend apps/backend
