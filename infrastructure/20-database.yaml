AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Layer 2 - Data. Creates the RDS PostgreSQL instance inside the private
  database subnets plus the Secrets Manager secret that holds its credentials.
  The password is generated by AWS, never typed by a human and never stored
  in Git.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  DbName:
    Type: String
    Default: appdb
  DbMasterUsername:
    Type: String
    Default: appadmin
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbEngineVersion:
    Type: String
    Default: '16'
    Description: Major version only - AWS selects the latest supported minor.
  MultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  BackupRetentionDays:
    Type: Number
    Default: 7

Conditions:
  IsProd: !Equals [!Ref EnvironmentName, prod]

Resources:

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/app/database'
      Description: !Sub 'PostgreSQL master credentials for ${EnvironmentName}'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludeCharacters: '"@/\''`'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'Private database subnets for ${EnvironmentName}'
      SubnetIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DbSubnet1'
        - Fn::ImportValue: !Sub '${EnvironmentName}-DbSubnet2'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-app-postgres'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroup'
      MultiAZ: !Ref MultiAz
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !If [IsProd, true, false]
      EnablePerformanceInsights: true
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Writes host, port, dbname and engine back into the same secret, so the
  # application only ever needs ONE secret ARN.
  SecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

Outputs:
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseSecretArn'
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseEndpoint'
  DatabaseName:
    Value: !Ref DbName
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseName'
